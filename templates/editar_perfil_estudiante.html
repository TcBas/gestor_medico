{% extends 'base.html' %}
{% block content %}
<div class="contenido" style="padding-top: 100px; min-height: 80vh; display: flex; flex-direction: column; align-items: center;">
  <div style="background: rgba(44, 47, 72, 0.95); border-radius: 16px; box-shadow: 0 0 20px #4fa7ff44; padding: 40px 30px; max-width: 500px; width: 100%; text-align: center;">
    <h2 style="color: #4fa7ff;">Editar Perfil del Estudiante</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="glowing-btn" style="margin-top: 25px;">Guardar Cambios</button>
    </form>
    <a href="{% url 'vista_estudiante' %}" class="glowing-btn" style="margin-top: 15px;">Volver</a>
  </div>
</div>
{% endblock %}
