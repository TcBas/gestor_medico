{% extends 'base.html' %}

{% block content %}
<div class="contenido">
  <div class="login-wrapper">

    <!-- MENSAJE ARRIBA DEL FORMULARIO -->
    {% if messages %}
      <ul class="messages" style="list-style: none; padding: 10px; border-radius: 8px; background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; margin-bottom: 20px; text-align: center;">
        {% for message in messages %}
          <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>
            {{ message }}
          </li>
        {% endfor %}
      </ul>
    {% endif %}

    <!-- FORMULARIO -->
    <form class="login-form" method="POST">
      {% csrf_token %}
      <h2>Iniciar Sesión</h2>
      <input type="text" name="username" placeholder="Usuario" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit" class="glowing-btn">Ingresar</button>
      <div style="text-align: center; margin-top: 15px;">
        <a href="{% url 'password_reset' %}" style="color: #007bff;">¿Olvidaste tu contraseña?</a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
