{% extends 'base.html' %}
{% block content %}
<div class="contenido">
  <div class="login-wrapper">
    <form class="login-form" method="post">
      {% csrf_token %}
      <h2 style="color:#4fa7ff;">Restablecer Contraseña</h2>
      <p style="color:#fff; margin-bottom:18px;">Ingresa tu correo electrónico registrado y recibirás un enlace para restablecer tu contraseña.</p>
      {{ form.email.label_tag }}
      {{ form.email }}
      <button type="submit" class="glowing-btn" style="margin-top:18px;">Enviar enlace</button>
      <div style="text-align:center; margin-top:15px;">
        <a href="{% url 'login' %}" style="color:#4fa7ff;">Volver al inicio de sesión</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
